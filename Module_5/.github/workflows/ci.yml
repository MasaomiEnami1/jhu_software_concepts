name: Module 5 CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    # This line tells GitHub to run everything inside your Module_5 folder
    defaults:
      run:
        working-directory: ./Module_5

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies (Graphviz)
      run: |
        sudo apt-get update
        sudo apt-get install -y graphviz

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        pip install pytest pylint pydeps

    - name: 1. Run Pylint (Enforce 10/10)
      run: |
        pylint src/ --fail-under=10

    - name: 2. Generate dependency.svg
      run: |
        pydeps src/app.py --noshow -T svg -o dependency.svg
        if [ ! -f dependency.svg ]; then 
          echo "Error: dependency.svg was not generated!"
          exit 1
        fi

    - name: 3. Run Snyk Security Scan
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      run: |
        npm install -g snyk
        snyk auth $SNYK_TOKEN
        snyk test
      continue-on-error: true

    - name: 4. Run Pytest
      run: |
        pytest