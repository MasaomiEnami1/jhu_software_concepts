name: Module 5 CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install system dependencies (Graphviz)
      run: |
        sudo apt-get update
        sudo apt-get install -y graphviz

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest

    - name: 1. Run Pylint
      run: |
        pylint src/ --fail-under=10

    - name: 2. Generate Dependency Graph (Fail if missing)
      run: |
        pydeps src/app.py --noshow -T svg -o dependency.svg
        if [ ! -f dependency.svg ]; then 
          echo "Error: dependency.svg was not generated!"
          exit 1
        else
          echo "Success: dependency.svg generated."
        fi

    - name: 3. Run Pytest
      run: |
        pytest

    - name: 4. Run Snyk Security Scan
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      run: |
        npm install -g snyk
        snyk auth $SNYK_TOKEN
        snyk test
      continue-on-error: true