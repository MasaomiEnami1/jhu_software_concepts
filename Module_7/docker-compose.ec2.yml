cat << 'EOF' > docker-compose.ec2.yml
services:
  db:
    image: postgres:16
    container_name: module6-db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: applicant_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d applicant_db"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network
  rabbitmq:
    image: rabbitmq:3.13-management
    container_name: module6-rabbitmq
    ports:
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD-SHELL", "rabbitmq-diagnostics -q ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-network
  web:
    image: masaomienami/module_6:v1-web
    container_name: module6-web
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      FLASK_ENV: development
      DATABASE_HOST: db
      DATABASE_USER: user
      DATABASE_PASSWORD: password
      DATABASE_DB: applicant_db
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/%2f"
    networks:
      - app-network
  worker:
    image: masaomienami/module_6:v1-worker
    container_name: module6-worker
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    environment:
      DATABASE_HOST: db
      DATABASE_USER: user
      DATABASE_PASSWORD: password
      DATABASE_DB: applicant_db
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/%2f"
    networks:
      - app-network
networks:
  app-network:
    driver: bridge
EOF